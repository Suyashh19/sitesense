# City profile for Pune (PRD section 7, DS-01..DS-07 and ES-01..ES-08). Adding a city = adding a file like this one.
# Everything under `estimates` and `localities` is an ESTIMATE, not measured data, and the app labels it that way.
key: pune
name: Pune
country: IN
bbox: {south: 18.44, west: 73.72, north: 18.66, east: 73.97}   # PMC + Pimpri-Chinchwad + Hinjewadi + Kharadi corridors
h3_resolution: 9
worldpop_url: https://data.worldpop.org/GIS/Population/Global_2000_2020_1km/2020/IND/ind_ppp_2020_1km_Aggregated.tif
overpass_endpoints:
  - https://overpass-api.de/api/interpreter
  - https://overpass.kumi.systems/api/interpreter
  - https://overpass.private.coffee/api/interpreter
estimates:
  commercial_multiplier: 1.6          # commercial price per sq ft vs residential
  monthly_yield: 0.006                # monthly rent = price x yield (ES-02)
  deposit_months: 6                   # part of upfront budget (A-12)
  idw_bandwidth_km: 2.5               # smoothing of locality prices between neighbourhoods (ES-01)
  workers_per_office: 40
  students_per_college: 1800
  visitors_per_hospital: 600
