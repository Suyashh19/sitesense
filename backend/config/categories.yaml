# Brand-tier attractiveness multipliers for the gravity model (ES-07).
tiers: {national_chain: 1.6, regional_chain: 1.25, independent: 1.0}
# Shared infrastructure selectors (OSM tags) used for FG5 anchors and FG7 accessibility.
anchors: [{shop: [mall, department_store, supermarket, marketplace]}, {amenity: [marketplace, cinema, bank]}, {tourism: [attraction]}]
transit: {station: [{railway: [station, subway_entrance]}, {public_transport: [station]}], bus: [{highway: [bus_stop]}]}
roads: [trunk, primary, secondary, tertiary]
education: [{amenity: [college, university]}]
hospitals: [{amenity: [hospital]}]
