# Retail DNA, version 1 (PRD section 11 + Appendix A). One block per category. Adding a category changes no code.
# Weights are expert priors for FG1..FG10 and must sum to 100. Economics are stated assumptions (ES-05/06).
version: 1
factor_groups:
  FG1: Residential Demand
  FG2: Daytime Workforce
  FG3: Youth and Students
  FG4: Affluence
  FG5: Footfall Anchors
  FG6: Category Complementors
  FG7: Accessibility
  FG8: Competition Headroom
  FG9: Affordability
  FG10: Growth
categories:
  sports:
    name: Sports & Gym Equipment
    icon: "sports"
    blurb: Sports shops, gym gear and fitness equipment stores
    competitors: [{shop: [sports, outdoor]}]
    complementors: [{leisure: [fitness_centre, sports_centre, stadium, pitch, park]}, {amenity: [college, university]}]
    chains: [decathlon, sport station, nike, adidas, puma, reebok, under armour, sports authority]
    dna: {FG1: 14, FG2: 4, FG3: 20, FG4: 10, FG5: 6, FG6: 22, FG7: 8, FG8: 8, FG9: 6, FG10: 2}
    behaviour: {type: mild_clustering, alpha: 1.0, beta: 2.0}
    econ: {margin: 0.30, fixed_lakh: 2.5, size_sqft: 1200, fitout_psf: 1800, inventory_lakh: 18, spend_per_person: 75, catchment_km: 2.5, other_density: 0.08}
  food:
